<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>才弥の数学クエスト</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    button { margin: 6px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid #aaa; cursor: pointer; width: 100%; text-align: left; }
    .small { color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>才弥の数学クエスト</h1>

  <div class="card">
    <h3>学習ステータス</h3>
    <div id="status"></div>
  </div>

  <div class="card">
    <h3 id="qTitle">問題</h3>
    <div id="question"></div>
    <div id="choices"></div>
    <p id="result"></p>
    <p id="explanation" class="small"></p>
  </div>

  <div class="card">
    <button id="endBtn">今日の学習を終了して保存</button>
  </div>

  <script src="./questions.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
